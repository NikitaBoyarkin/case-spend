[project]
name = "case-spend"
version = "1.0.0"
description = "Volta case study — spend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib", "seaborn", "scipy", "scikit-learn"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pre-commit"]

[tool.ruff]
line-length = 100
src = ["scripts", "."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
files = [
    "scripts/volta_spend_analysis.py",
    "scripts/generate_transactions_data.py",
    "utils/common.py",
    "utils/viz_helpers.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = "--cov=volta_spend_analysis --cov-report=term-missing"

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
